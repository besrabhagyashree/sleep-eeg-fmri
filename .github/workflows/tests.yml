name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff
      - name: Code check (syntax errors, undefined names, unused imports)
        run: ruff check src studies tests
      - name: Every script compiles
        run: python -m compileall -q src studies tests
      - name: Tests (synthetic signals with known answers; no dataset needed)
        run: pytest -q -p no:cacheprovider tests
